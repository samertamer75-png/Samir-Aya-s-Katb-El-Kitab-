<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة كتب كتاب - سمير وآية</title>
    <!-- مكتبة الاحتفال بالزخات الملونة (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --burgundy: #7a0f26;
            --burgundy-dark: #4d0616;
            --gold: #d4af37;
            --bg-light: #fbf8f5;
            --text-dark: #3a151d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Amiri', 'Traditional Arabic', 'Segoe UI', Tahoma, sans-serif;
            background-color: #1a0408;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* ===== شاشة الظرف الفاخر ===== */
        .envelope-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--burgundy-dark), var(--burgundy), #30030c);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.8s ease, visibility 0.8s;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        }

        .envelope-screen.opened {
            transform: scale(1.15) translateY(-50px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .royal-envelope {
            position: relative;
            width: 90%;
            max-width: 360px;
            height: 520px;
            background: radial-gradient(circle, #8d132d 0%, #580a1a 100%);
            border-radius: 16px;
            border: 2px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 0 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            overflow: hidden;
        }

        .royal-envelope::before, .royal-envelope::after {
            content: "🌿🌸🌿";
            position: absolute;
            font-size: 2.2rem;
            opacity: 0.25;
            color: var(--gold);
            filter: drop-shadow(0 2px 4px #000);
        }
        .royal-envelope::before { top: 15px; right: 15px; transform: rotate(45deg); }
        .royal-envelope::after { bottom: 15px; left: 15px; transform: rotate(-135deg); }

        .envelope-top-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 220px;
            background: linear-gradient(180deg, #6b0c20 0%, #4a0715 100%);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            z-index: 2;
        }

        .wax-seal-container {
            position: absolute;
            top: 180px;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wax-seal-royal {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #a81c39 0%, #590918 100%);
            border-radius: 50%;
            border: 3px dashed var(--gold);
            box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: sealPulse 2.2s infinite alternate;
        }

        .wax-seal-royal::after {
            content: "💍";
            font-size: 1.8rem;
        }

        @keyframes sealPulse {
            0% { transform: scale(1); box-shadow: 0 6px 20px rgba(0,0,0,0.6); }
            100% { transform: scale(1.08); box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4); }
        }

        .tap-prompt {
            position: absolute;
            bottom: 40px;
            color: #f3e5ab;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            animation: bouncePrompt 1.8s infinite;
            z-index: 3;
        }

        @keyframes bouncePrompt {
            0%, 100% { transform: translateY(0); opacity: 0.8; }
            50% { transform: translateY(-6px); opacity: 1; }
        }

        /* ===== المحتوى الداخلي الرئيسي ===== */
        .main-wrapper {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background-color: var(--bg-light);
            display: none;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            padding-bottom: 40px;
        }

        .main-wrapper.visible {
            display: flex !important;
            animation: fadeInUp 0.9s ease forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-header-bar {
            width: 100%;
            background: linear-gradient(90deg, #590918, #8a132d, #590918);
            color: var(--gold);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .top-header-bar .date-badge {
            background: rgba(212, 175, 55, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--gold);
            font-size: 0.95rem;
        }

        .couple-header {
            margin: 25px 0 15px 0;
            text-align: center;
        }

        .couple-names {
            font-size: 2.8rem;
            color: var(--burgundy);
            font-weight: bold;
            line-height: 1.2;
        }

        .couple-names span {
            color: var(--gold);
            font-size: 2rem;
            margin: 0 8px;
        }

        .sub-verse {
            font-size: 1.05rem;
            color: #666;
            padding: 0 20px;
            margin-bottom: 20px;
            line-height: 1.6;
            text-align: center;
        }

        /* العداد التنازلي */
        .countdown-row {
            display: flex;
            gap: 10px;
            margin: 10px 0 25px 0;
            direction: ltr;
        }

        .count-card {
            background: #ffffff;
            border: 1px solid #e2d2be;
            border-radius: 12px;
            padding: 10px 12px;
            min-width: 68px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(122, 15, 38, 0.08);
        }

        .count-num {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--burgundy);
            font-family: 'Segoe UI', sans-serif;
        }

        .count-unit {
            font-size: 0.75rem;
            color: #888;
            margin-top: 2px;
            direction: rtl;
        }

        /* معرض الصور الشبكي (Grid Layout) */
        .album-section {
            width: 90%;
            margin: 15px 0;
            text-align: center;
        }

        .album-title {
            font-size: 1.4rem;
            color: var(--burgundy);
            margin-bottom: 15px;
            font-weight: bold;
            position: relative;
            display: inline-block;
        }

        .album-title::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 20%;
            width: 60%;
            height: 2px;
            background: var(--gold);
        }

        .grid-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 5px;
        }

        .gallery-card {
            background: #fff;
            padding: 8px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #f0e4d5;
            transition: transform 0.3s ease;
        }

        .gallery-card:hover {
            transform: translateY(-4px);
        }

        .gallery-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10
