<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katb Kitab Invitation - Samir & Aya</title>
    <!-- استيراد الخطوط الفخمة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #8b5a2b;
            --secondary-color: #d4af37;
            --bg-color: #e8e3dc;
            --card-bg: #f9f6f0;
            --text-dark: #6e2a36;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cinzel', serif, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        /* ===== شاشة الظرف المغلق ===== */
        .envelope-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            cursor: pointer;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .envelope-screen.opened {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        .invitation-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 35px 20px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 2px solid var(--secondary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .invited-text-en {
            font-size: 0.95rem;
            color: var(--text-dark);
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            font-weight: 600;
            line-height: 1.5;
            padding: 0 10px;
        }

        .couple-names-en {
            font-size: 2.8rem;
            color: var(--text-dark);
            font-family: 'Great Vibes', cursive;
            margin: 10px 0;
            line-height: 1.1;
        }

        .couple-names-en span {
            display: block;
            font-size: 1.5rem;
