<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة كتب كتاب سمير وآية</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8b5a2b;
            --secondary-color: #d4af37;
            --bg-color: #f5f0eb;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Amiri', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* شاشة الغلاف التفاعلي (الظرف) */
        .envelope-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            padding: 20px;
        }

        .envelope-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .envelope-card {
            background: var(--card-bg);
            max-width: 450px;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: 2px solid var(--secondary-color);
            cursor: pointer;
            text-align: center;
            animation: pulse-glow 2s infinite;
        }

        .envelope-card img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .open-btn {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1.3rem;
            font-family: 'Reem Kufi', sans-serif;
            border-radius: 30px;
            margin: 20px 0;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: background 0.3
