<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة كتب كتاب - سمير وآية</title>
    <!-- مكتبة التأثيرات الذهبية والزخات الاحتفالية -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #8b5a2b;
            --secondary-color: #d4af37;
            --bg-color: #e8e3dc;
            --card-bg: #f9f6f0;
            --text-dark: #6e2a36;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Traditional Arabic', 'Amiri', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        /* ===== شاشة الظرف المغلق والتأثير العنابي والذهبي ===== */
        .envelope-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            cursor: pointer;
            perspective: 1000px;
            transition: opacity 0.8s ease 0.4s, visibility 0.8s ease 0.4s;
        }

        .envelope-screen.opened {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .invitation-card {
            position: relative;
            background-color: var(--card-bg);
            width: 100%;
            max-width: 380px;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 2px solid var(--secondary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* غطاء الظرف العلوي الذي يتفتح لأعلى */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(180deg, #d2c4b4, #ede6dd);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            border-bottom: 2px solid var(--secondary-color);
            transform-origin: top center;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .envelope-screen.opening .envelope-flap {
            transform: rotateX(180deg);
        }

        .invited-text {
            font-size: 1.2rem;
            color: var(--text-dark);
            margin-bottom: 5px;
            line-height: 1.5;
            margin-top: 20px;
        }

        .couple-names-ar {
            font-size: 2.8rem;
            color: var(--text-dark);
            font-weight: bold;
            line-height: 1.2;
            margin: 15px 0;
        }

        .couple-names-ar span {
            display: block;
        }

        .and-symbol-ar {
            font-size: 2rem;
            color: var(--secondary-color);
        }

        .envelope-box {
            position: relative;
            width: 100%;
            max-width: 280px;
            height: 130px;
            background: #ede6dd;
            border-radius: 8px;
            border: 1px solid #dcd3c8;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0 20px 0;
        }

        .simple-seal {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #a81c39, #6e2a36);
            color: #d4af37;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            border: 2px solid var(--secondary-color);
            z-index: 11;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .envelope-screen.opening .simple-seal {
            transform: scale(0);
            opacity: 0;
        }

        .tap-to-open {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-dark);
            animation: bounceText 1.8s infinite;
        }

        @keyframes bounceText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* ===== محتوى الدعوة الداخلي ===== */
        .main-content {
            max-width: 550px;
            width: 100%;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
            border: 2px solid #f1e5d1;
            margin: 20px auto;
            display: none;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease 0.3s, transform 0.8s ease 0.3s;
        }

        .main-content.visible {
            display: block !important;
            opacity: 1;
            transform: translateY(0);
        }

        .header-title {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .names-ar-inside {
            font-size: 3.2rem;
            color: var(--secondary-color);
            margin: 15px 0 10px 0;
            font-weight: bold;
            line-height: 1.2;
        }

        .names-ar-inside span {
            display: block;
        }

        .and-symbol-inside {
            font-size: 2rem;
            color: var(--primary-color);
        }

        .verse {
            font-size: 1.2rem;
            color: #555;
            margin: 15px 0;
            font-style: italic;
        }

        /* العداد التنازلي */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 25px 0;
            direction: ltr;
        }

        .time-box {
            background: linear-gradient(145deg, #6e2a36, #8a1c2e);
            border: 1px solid var(--secondary-color);
            border-radius: 12px;
            padding: 10px 8px;
            min-width: 65px;
            box-shadow: 0 4px 12px rgba(110, 42, 54, 0.25);
            color: #ffffff;
        }

        .time-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #d4af37;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .time-label {
            font-size: 0.8rem;
            color: #fdf8f2;
            margin-top: 3px;
            direction: rtl;
        }

        /* معرض الصور مع الأسهم والنقاط */
        .slider-container {
            position: relative;
            width: 100%;
            margin: 25px 0;
            overflow: hidden;
            border-radius: 12px;
            background: #faf6f0;
            padding: 15px 10px;
        }

        .slider-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 10px;
            transition: opacity 0.3s ease;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(139, 90, 43, 0.85);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }

        .slider-btn:hover {
            background-color: var(--primary-color);
            transform: translateY(-50%) scale(1.1);
        }

        .prev-btn { right: 10px; }
        .next-btn { left: 10px; }

        .dots-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .dot {
            width: 11px;
            height: 11px;
            background-color: #dcd3c8;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: var(--primary-color);
            transform: scale(1.3);
        }

        .details {
            margin: 25px 0;
            padding: 20px;
            background: #fdf8f2;
            border-radius: 12px;
            border-right: 5px solid var(--secondary-color);
            text-align: right;
        }

        .details p {
            font-size: 1.2rem;
            margin: 8px 0;
        }

        .map-btn {
            display: inline-block;
            background-color: var(--secondary-color);
            color: #fff;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 25px;
            text-decoration: none;
            margin-top: 15px;
            font-weight: bold;
        }

        .footer {
            margin-top: 25px;
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

                <span>آية</span>

            <div class="envelope-box">
                <div class="simple-seal">س & آ</div>
