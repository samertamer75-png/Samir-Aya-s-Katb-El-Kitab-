<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة كتب كتاب - سمير وآية</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8b5a2b;
            --secondary-color: #d4af37;
            --bg-color: #e8e3dc;
            --card-bg: #f9f6f0;
            --text-dark: #6e2a36;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Amiri', serif;
            background-color: var(--bg-color);
            color: #333;
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* ===== شاشة الظرف المغلق (البداية) ===== */
        .envelope-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            padding: 20px;
            cursor: pointer;
        }

        .envelope-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* البطاقة الرئيسية للغطاء */
        .invitation-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 35px 25px 30px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .invited-text {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 1.2rem;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        /* الأسماء تحت بعض بخط كبير في الغلاف بالعربي */
        .couple-names-ar {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 2.8rem;
            color: var(--text-dark);
            font-weight: 700;
            line-height: 1.2;
            margin: 10px 0;
        }

        .couple-names-ar span {
            display: block;
        }

        .and-symbol-ar {
            font-size: 1.8rem;
            color: var(--secondary-color);
            margin: 2px 0;
        }

        .sub-header {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            color: #8c726a;
            margin-bottom: 20px;
        }

        /* رسم الظرف الشمعي */
        .envelope-box {
            position: relative;
            width: 100%;
            max-width: 320px;
            height: 170px;
            background: #ede6dd;
            border-radius: 6px;
            border: 1px solid #dcd3c8;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        /* طية الظرف */
        .envelope-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            margin: 0 auto;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 95px solid #f2ece4;
        }

        /* الختم الشمعي */
        .wax-seal {
            position: relative;
            z-index: 5;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #8a1c2e 0%, #5c101c 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255,255,255,0.85);
            font-family: 'Reem Kufi', sans-serif;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            border: 2px solid #4a0d17;
        }

        .quote-1 {
            font-family: 'Amiri', serif;
            font-size: 1.1rem;
            color: #777;
            margin-bottom: 4px;
        }

        .quote-2 {
            font-family: 'Reem Kufi', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-dark);
        }

        .tap-to-open {
            margin-top: 18px;
            font-family: 'Reem Kufi', sans-serif;
            font-size: 1.2rem;
            color: var(--text-dark);
            letter-spacing: 1px;
            animation: fadeInOut 2s infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ===== محتوى الدعوة من الداخل ===== */
        .main-content {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 2px solid #f1e5d1;
            margin: 20px auto;
            display: none;
        }

        .main-content.visible {
            display: block;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2, h3 {
            font-family: 'Reem Kufi', sans-serif;
            color: var(--primary-color);
        }

        .header-title {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        /* الأسماء بالعربي بالداخل تحت بعض وبخط كبير */
        .names-ar-inside {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 3.2rem;
            color: var(--secondary-color);
            margin: 15px 0;
            font-weight: bold;
            line-height: 1.2;
        }

        .names-ar-inside span {
            display: block;
        }

        .and-symbol-inside {
            font-size: 2rem;
            color: var(--primary-color);
            margin: 5px 0;
        }

        .verse {
            font-size: 1.15rem;
            color: #555;
            margin: 15px 0;
            font-style: italic;
        }

        /* معرض الصور بالداخل */
        .slider-container {
            position: relative;
            width: 100%;
            margin: 25px 0;
            overflow: hidden;
            border-radius: 15px;
            background: #faf6f0;
            padding: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
        }

        .slider-wrapper {
            display: flex;
            transition: transform 0.4s ease-in-out;
            width: 100%;
        }

        .slide {
            min-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide img {
            max-width: 100%;
            max-height: 420px;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(139, 90, 43, 0.75);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .prev-btn { right: 12px; }
        .next-btn { left: 12px; }

        .dots-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #ccc;
            border-radius: 50%;
            cursor: pointer;
        }

        .dot.active {
            background-color: var(--secondary-color);
            width: 12px;
            height: 12px;
        }

            margin: 25px 0;
            padding: 2
